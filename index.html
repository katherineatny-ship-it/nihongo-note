<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語ノート">
<meta name="theme-color" content="#b8473a">
<title>日本語ノート</title>
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--ink:#26221f;--mute:#776f68;--line:#e6ddd0;--accent:#b8473a;--accent2:#f6e3df;--ok:#2f7a4a;--ok2:#e3f2e7;--ng:#b23a2a;--ng2:#fbe5e0;--warn:#9a6a12;--warn2:#fbf0d9;--blue:#2d5f8a;--blue2:#e2edf6;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#ece6df;--mute:#a59d95;--line:#37312c;--accent:#e58a7c;--accent2:#3a2622;--ok:#7fcf98;--ok2:#1d3325;--ng:#f08f7f;--ng2:#3b221e;--warn:#e6bb5c;--warn2:#3a2f19;--blue:#8ab9e3;--blue2:#1d2b38;--onacc:#1d1210}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans","Noto Sans TC","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.jp,ruby{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang TC",sans-serif}
rt{font-size:.55em;color:var(--mute)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
h2{font-size:15px;margin:0 0 10px}
.sec-h{font-size:14px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.lt{font-size:22px;margin:10px 0 0}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=url],input[type=password],input[type=search],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
input[type=file]{font-size:14px;max-width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:6px 0}
.cks{display:grid;gap:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:7px 0 9px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center}
nav .i{font-size:20px;position:relative;line-height:1.3}
nav button.on{color:var(--accent);font-weight:600}
.nb{position:absolute;top:-3px;left:16px;background:var(--ng);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:600}
.iconbtn{border:0;background:none;font-size:22px;padding:4px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--onacc);font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.btn.bad{background:var(--ng2);color:var(--ng)}
.btn.good{background:var(--ok2);color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:14px}
.full{width:100%;display:block}
.filebtn{display:block;margin:0;font-size:16px}
.filebtn input{display:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box.ai{border-style:dashed}
.okbox{background:var(--ok2);border-color:transparent}
.ngbox{background:var(--ng2);border-color:transparent}
.warnbox{background:var(--warn2);border-color:transparent}
.muted{color:var(--mute);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
.pre{white-space:pre-wrap;word-break:break-word}
.bad{color:var(--ng)}.ok{color:var(--ok)}.ng{color:var(--ng)}.okc{color:var(--ok)}
.sec{margin-top:10px}
.big{font-size:42px;font-weight:700;color:var(--accent)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent);line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
.stat.errs b{color:var(--ng)}
.lesson{cursor:pointer}
.lname{font-size:17px}
.badge{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin:2px 2px 0 0;white-space:nowrap}
.st-complete{background:var(--ok2);color:var(--ok)}.st-partial{background:var(--warn2);color:var(--warn)}.st-unverified{background:var(--blue2);color:var(--blue)}.st-pending{background:var(--line);color:var(--mute)}
.tag{display:inline-block;font-size:12px;background:var(--line);color:var(--mute);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0}
.tag.ai{background:var(--blue2);color:var(--blue)}.tag.mine{background:var(--ok2);color:var(--ok)}.tag.l{background:var(--warn2);color:var(--warn)}
.tp{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:2px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.item summary,details.prow summary{list-style:none;padding:10px 12px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details.item .body,details.prow .body{padding:0 12px 12px;border-top:1px solid var(--line)}
.ttl{font-size:17px;line-height:1.9}
.sub{font-size:14px;color:var(--mute)}
.spk{border:0;background:none;padding:0 4px;font-size:17px;cursor:pointer;flex:0 0 auto !important}
.src .pre{margin-top:6px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.sm{margin:6px 0 0}.seg.sm button{padding:4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.progress{height:4px;background:var(--line);border-radius:2px;margin-bottom:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.qbox{padding:18px 16px}
.q{font-size:21px;line-height:2.1;word-break:break-word}
.big-jp{font-size:40px;text-align:center}
.zh{color:var(--mute);margin-top:4px}
.ctx{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px;line-height:1.8}
input.blank{display:inline-block;width:4.2em;padding:2px 6px;margin:0 3px;font-size:20px;text-align:center;border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;background:var(--accent2);vertical-align:middle}
.blankres{display:inline-block;padding:0 6px;margin:0 2px;border-radius:6px;font-weight:600}
.blankres.ok{background:var(--ok2)}.blankres.ng{background:var(--ng2);text-decoration:line-through}
.blankfix{display:inline-block;padding:0 6px;border-radius:6px;background:var(--ok2);color:var(--ok);font-weight:600;margin-right:2px}
.ansin{margin-top:12px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-size:18px;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--accent2);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok2);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--ng);background:var(--ng2);color:var(--ng);text-decoration:line-through}
.opt:disabled{cursor:default}
.wrongtxt{color:var(--ng);text-decoration:underline wavy var(--ng);text-underline-offset:5px;text-decoration-thickness:1px}
.aibox{background:var(--blue2);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px;cursor:pointer}
.bar .n{width:5em;flex:0 0 5em}
.bar .t{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ng);border-radius:5px}
.bar .c{width:24px;text-align:right;font-weight:600}
.bar .acc{width:40px;text-align:right;color:var(--mute);font-size:13px}
.mist .jp{font-size:17px}
.tutor.done{opacity:.7}
.mcard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.mn{font-size:22px;color:var(--accent);font-weight:700;line-height:1.2}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute)}
.th img{width:70px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.warnline{color:var(--warn);font-size:13px;margin-top:4px}
.errline{color:var(--ng);font-size:13px;margin-top:6px;font-weight:600}
.dupline{background:var(--warn2);border-radius:8px;padding:6px 8px;font-size:13px;margin-top:8px}
details.prow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;margin-bottom:8px}
details.prow summary{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.st-err{border-left-color:var(--ng)}.prow.st-skip,.prow.st-off{border-left-color:var(--line);opacity:.65}.prow.st-sim,.prow.st-merge{border-left-color:var(--warn)}
.pst{font-size:11px;font-weight:600;margin-right:6px;padding:1px 6px;border-radius:5px;background:var(--ok2);color:var(--ok)}
.st-err .pst{background:var(--ng2);color:var(--ng)}.st-skip .pst,.st-off .pst{background:var(--line);color:var(--mute)}.st-sim .pst,.st-merge .pst{background:var(--warn2);color:var(--warn)}
details.grp{margin-bottom:6px}
details.grp>summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;padding:10px 2px;color:var(--accent)}
details.grp>summary::before{content:"▾ ";}
details.grp:not([open])>summary::before{content:"▸ ";}
.libitem b{font-size:16px}
.stline{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.stline:last-child{border:0}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
a{color:var(--blue);word-break:break-all}
ol{padding-left:20px;margin:8px 0}
pre.pre{font-family:inherit;margin:8px 0}
</style>
</head>
<body>
<header><div class="top"><h1>日本語ノート<small>錯題・教材・練習</small></h1><button class="iconbtn" onclick="openView('settings')" aria-label="設定">⚙️</button></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ===== 預載教材（由 Claude 從您的資料夾整理）===== */
const SEED_VERSION = 2;
const SEED = (() => {
  const V = (id, term, reading, meaning, cat, lesson, sourceId, extra) => Object.assign({ id, type: 'vocab', term, reading, meaning, example: '', note: '', tags: [], category: cat, lesson, sourceId, origin: 'teacher', aiAdded: [] }, extra || {});
  const G = (id, term, meaning, example, note, cat, lesson, sourceId, extra) => Object.assign({ id, type: 'grammar', term, reading: '', meaning, example, note, tags: [], category: cat, lesson, sourceId, origin: 'teacher', aiAdded: [] }, extra || {});
  const Q = (id, kind, o) => Object.assign({ id, kind, context: '', zh: '', prompt: '', options: [], answers: [], explain: '', category: '其他', lesson: '', sourceId: '', origin: 'teacher', answerFrom: 'material' }, o);

  const sources = [
    { id: 'src-l12', kind: 'teacher', title: '日文課第1-2堂（講義、第1堂助詞篇、作業）', lesson: '第1-2堂', file: '1老師提供的上課教材/1~2/（4 個檔案）', url: '', status: 'partial', note: '主講義與第1堂助詞篇大多是圖片，尚未匯入。資料夾名稱「1~2」中的「~」讓系統無法直接讀取檔案，建議改名為「1-2」。目前只匯入第2堂作業的文字部分（翻譯題無老師解答，參考答案為 AI 提供）。' },
    { id: 'src-l3', kind: 'scan', title: '日文課第3堂講義「私の生活」', lesson: '第3堂', file: '1老師提供的上課教材/3/日文課第3堂.pdf', url: '', status: 'unverified', note: '圖片講義，由 Claude 看圖整理單字、文法與例句。中文意思與文法說明為 AI 補充；講義上的手寫筆記未匯入。' },
    { id: 'src-l3hw', kind: 'teacher', title: '日文課第3堂作業1018', lesson: '第3堂', file: '1老師提供的上課教材/3/日文課第3堂作業1018.pdf', url: '', status: 'complete', note: '文字版，含老師參考答案，已完整匯入。練習二第1題的參考答案疑似筆誤，已列入家教清單。' },
    { id: 'src-l3tbl', kind: 'scan', title: '第3堂量詞表（訂正）、年齡表', lesson: '第3堂', file: '1老師提供的上課教材/3/量詞表（訂正）.pdf、年齡表.pdf', url: '', status: 'pending', note: '圖片表格，尚未匯入。可用「匯入 → PDF／圖片」補入。' },
    { id: 'src-l56', kind: 'teacher', title: '日文課第5-6堂教材（含作業）1101', lesson: '第5-6堂', file: '1老師提供的上課教材/5-6/日文課第5-6堂課程教材(含作業)1101.pdf', url: '', status: 'partial', note: '文字版講義。單字表、文法說明、作業、閱讀題與解答已匯入；會話練習與綜合會話未匯入。' },
    { id: 'src-l56s', kind: 'scan', title: '日文助詞分類對照表（第5-6堂補充）', lesson: '第5-6堂', file: '1老師提供的上課教材/5-6/日文課第5-6堂課程補充教材1101.pdf', url: '', status: 'unverified', note: '圖片表格，由 Claude 看圖整理，請對照原檔確認。' }
  ];

  const L56 = '第5-6堂', S56 = 'src-l56';
  const items = [
    // 第2堂
    G('g-l2-suki', '〜が好きです／好きじゃないです／嫌いです', '表達喜歡與討厭。語氣：好きです（一般肯定）→ 好きじゃないです（一般否定）→ 嫌いです（強烈否定）。', 'スポーツが好きです。（我喜歡運動）\nスポーツが好きじゃないです。（我不喜歡運動）\nスポーツが嫌いです。（我討厭運動）', '「嫌い」語氣很強，平常說不喜歡多用「好きじゃないです」。', '句型', '第1-2堂', 'src-l12'),

    // 第3堂 單字（圖片講義，中文為 AI 補充）
    ...[
      ['ベッド', '', '床'], ['机', 'つくえ', '書桌'], ['本棚', 'ほんだな', '書架、書櫃'], ['電気', 'でんき', '電燈；電'], ['窓', 'まど', '窗戶'], ['植物', 'しょくぶつ', '植物'], ['猫', 'ねこ', '貓'], ['テレビ', '', '電視'],
      ['父', 'ちち', '（自己的）父親'], ['母', 'はは', '（自己的）母親'], ['兄', 'あに', '（自己的）哥哥'], ['姉', 'あね', '（自己的）姊姊'], ['弟', 'おとうと', '弟弟'], ['妹', 'いもうと', '妹妹'], ['祖父', 'そふ', '（自己的）祖父'], ['祖母', 'そぼ', '（自己的）祖母'],
      ['電車', 'でんしゃ', '電車'], ['バス', '', '公車、巴士'], ['車', 'くるま', '汽車'], ['スーパー', '', '超市'], ['りんご', '', '蘋果'], ['バナナ', '', '香蕉'], ['牛乳', 'ぎゅうにゅう', '牛奶'], ['買い物', 'かいもの', '購物（名詞）']
    ].map(([t, r, m], i) => V('v-l3-' + i, t, r, m, '單字', '第3堂', 'src-l3', { origin: 'teacher', aiAdded: ['meaning'] })),
    G('g-l3-aru', 'あります・います（有／在）', 'あります：無生命的東西「有／在」；います：人或動物「有／在」。', '机の上に本があります。（桌上有書）\n部屋に猫がいます。（房間裡有貓）', '', '句型', '第3堂', 'src-l3', { aiAdded: ['meaning'] }),
    G('g-l3-ichi', '位置詞：〜の上・下・隣・中・前・後ろ', '表示位置：上面、下面、旁邊、裡面、前面、後面。句型：〔地點〕の〔位置〕に〔東西〕があります。', 'ベッドの下にかばんがあります。（床底下有包包）', '', '句型', '第3堂', 'src-l3', { aiAdded: ['meaning'] }),
    G('g-l3-kazoku', '人數〜人・年齡〜歳・家人的說法', '說明家裡有幾個人、幾歲。', '家族は4人です。（我家有四個人）\n母は45歳です。（媽媽45歲）\n弟が1人います。（我有一個弟弟）', '介紹自己的家人用 父・母・兄・姉；稱呼別人的家人或直接叫自己家人時用 お父さん・お母さん 等。', '句型', '第3堂', 'src-l3', { aiAdded: ['meaning', 'note'] }),
    G('g-l3-iku', '行く・来る・帰る＋へ（移動方向）', '「へ」表示移動的方向。', 'スーパーへ行きます。（去超市）', '', '助詞', '第3堂', 'src-l3', { aiAdded: ['meaning'] }),
    G('g-l3-kazu', '數量（〜つ・〜本・〜円）、いくら・ください', '購物時說數量、問價錢、說「請給我」。', 'りんごを3つください。（請給我三個蘋果）\nこれはいくらですか。（這個多少錢？）', '', '量詞', '第3堂', 'src-l3', { aiAdded: ['meaning'] }),

    // 第5-6堂 單字
    ...[
      ['も', '也、同樣'], ['と', '和、與'], ['から～まで', '從～到～'], ['や', '～和～等'], ['か', '嗎、或者'], ['の', '的'], ['ね', '呢、呀（尋求認同或確認）'], ['よ', '喔、哦（告知、提醒）'], ['しか～ない', '只有～、僅僅～'], ['でも', '即使～也、～之類、但是（依語境而定）']

": "src-lj-g3", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-1", "kind": "fill", "context": "", "zh": "", "prompt": "私（　）学生です。", "options": [], "answers": ["は"], "explain": "主題助詞「は」：「は」は主題を示す。「私は(as for me)学生です」。", "category": "助詞", "lesson": "文法初級 第4章 核心助詞", "sourceId": "src-lj-g4", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-2", "kind": "translate", "context": "", "zh": "「に」と「で」の違いを使って:1学校( )いる。2学校( )勉強する。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["1に(存在) / 2で(行為の場所)"], "explain": "に vs で：に:存在の場所(います/あります)。で:行為・動作の場所(します/食べます等)。", "category": "助詞", "lesson": "文法初級 第4章 核心助詞", "sourceId": "src-lj-g4", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-3", "kind": "translate", "context": "", "zh": "「も」を使って「彼女も学生です」から何が分かりますか?", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["他にも学生がいて、彼女もそのグループに属している"], "explain": "も(additive)の意味：「も」=also/too。すでに他の誰かが学生であることが前提で、「彼女も」で追加の情報を加える。", "category": "助詞", "lesson": "文法初級 第4章 核心助詞", "sourceId": "src-lj-g4", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-4", "kind": "translate", "context": "", "zh": "「を」が使われる場合を説明し、例を1つ作ってください。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["水を飲みます。"], "explain": "目的語助詞「を」：「を」は直接目的語(動作の対象)を示す。食べる・飲む・読む・見る等の他動詞の前に使う。", "category": "助詞", "lesson": "文法初級 第4章 核心助詞", "sourceId": "src-lj-g4", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-5", "kind": "translate", "context": "", "zh": "「から」と「まで」を使って文を作ってください。(例:家→学校)", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["家から学校まで 30分です。"], "explain": "から〜まで(from〜to)：から=from(起点)、まで=to/until(終点)。場所・時間の両方に使える。", "category": "助詞", "lesson": "文法初級 第4章 核心助詞", "sourceId": "src-lj-g4", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj4-6", "kind": "translate", "context": "", "zh": "「と」の使い方を2つ挙げて、それぞれ例文を作ってください。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["1AとB(並列)2〜と言う(引用)"], "explain": "助詞「と」の多機能：1パンと牛乳(and/listing)2「こんにちは」と言いました(quotation 画」と「静かな公園」の違いを文法的に説明してください。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["おもしろい:い形容詞+名詞(そのまま) / 静かな:な形容詞+な名詞(なを挿入)"], "explain": "い形容詞 vs な形容詞の名詞修飾：い形容詞は名詞の前にそのまま(おもしろい映画)、な形容詞は「な」を付ける(静かな公園)。", "category": "形容詞", "lesson": "文法初級 第6章 形容詞活用", "sourceId": "src-lj-g6", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj6-4", "kind": "translate", "context": "", "zh": "「昨日は暑かったですか?」に答えてください(肯定・否定両方)。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["はい、暑かったです。 / いいえ、暑くなかったです。"], "explain": "い形容詞の過去疑問と返答：〜かったですか?=was it 〜? 肯定:かったです、否定:くなかったです。", "category": "形容詞", "lesson": "文法初級 第6章 形容詞活用", "sourceId": "src-lj-g6", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj6-5", "kind": "translate", "context": "", "zh": "「彼女は元気じゃありませんでした」を英語に訳してください。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["She was not well (healthy)."], "explain": "な形容詞の過去否定：元気じゃありませんでした=was not genki/well. じゃありませんでした=was not (polite pastneg)", "category": "形容詞", "lesson": "文法初級 第6章 形容詞活用", "sourceId": "src-lj-g6", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj6-6", "kind": "translate", "context": "", "zh": "い形容詞2つを接続してください:「おいしい」「安い」→", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["おいしくて安い"], "explain": "い形容詞の接続(〜くて)：い形容詞の接続形:い→くて。「おいしくて安い」=tasty and cheap。", "category": "形容詞", "lesson": "文法初級 第6章 形容詞活用", "sourceId": "src-lj-g6", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj6-7", "kind": "translate", "context": "", "zh": "な形容詞2つを接続してください:「静か」「きれい」→", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["静かできれいな"], "explain": "な形容詞の接続(〜で)：な形容詞の接続形:〜で(〜でstem で)。「静かできれいな公園」=quiet and beautiful park。", "category": "形容詞", "lesson": "文法初級 第6章 形容詞活用", "sourceId": "src-lj-g6", "origin": "teacher", "answerFrom": "material"}, {"id": "q-lj6-8", "kind": "translate", "context": "", "zh": "「高い」の反対語と「好き」の反対語を答えてください。", "prompt": "回答（送出後自己對照）", "options": [], "answers": ["高い ↔ 安い / 好き ↔ 嫌い"], "explain": "形容詞の反対語：高い(expensive/tall)↔安い(cheap)/低い(lo /* ---------- storage ---------- */
function blank() { return { v: 2, seedVersion: 0, sources: [], items: [], questions: [], attempts: [], mistakes: [], tutor: [], settings: { apiKey: '', model: 'claude-sonnet-5-5', lastBackup: null, migratedV1: false } }; }
let S = load();
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
  const b = blank();
  if (!d) d = b;
  for (const k of Object.keys(b)) if (d[k] == null) d[k] = b[k];
  d.settings = Object.assign(b.settings, d.settings);
  return d;
}
let saveFail = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); saveFail = false; } catch (e) { if (!saveFail) toast('⚠️ 儲存失敗：瀏覽器空間不足或被封鎖，請先匯出備份'); saveFail = true; } }
function applySeed(force) {
  if (!force && S.seedVersion >= SEED_VERSION) return 0;
  let n = 0;
  const has = (arr, id) => arr.some(x => x.id === id);
  const now = Date.now();
  const all = { sources: [...SEED.sources.map(x => Object.assign({ group: TEACHER_GROUP }, x)), ...SEED2.sources], items: [...SEED.items, ...SEED2.items], questions: [...SEED.questions, ...SEED2.questions] };
  const ids = k => new Set(S[k].map(x => x.id));
  const si = ids('sources'), ii = ids('items'), qi = ids('questions');
  all.sources.forEach(s => { if (!si.has(s.id)) { S.sources.push(Object.assign({ created: now }, s)); n++; } else { const x = S.sources.find(y => y.id === s.id); if (!x.group) x.group = s.group; } });
  all.items.forEach(s => { if (!ii.has(s.id)) { S.items.push(Object.assign({ created: now, updated: now }, JSON.parse(JSON.stringify(s)))); n++; } });
  all.questions.forEach(s => { if (!qi.has(s.id)) { S.questions.push(Object.assign({ created: now }, JSON.parse(JSON.stringify(s)))); n++; } });
  if (!S.seedVersion || force) SEED.tutor.forEach(s => { if (!has(S.tutor, s.id)) { S.tutor.push(Object.assign({ created: now }, s)); n++; } });
  S.seedVersion = SEED_VERSION;
  save();
  return n;
}
function migrateV1() {
  if (S.settings.migratedV1) return 0;
  S.settings.migratedV1 = true;
  let old; try { old = JSON.parse(localStorage.getItem('mistakeNote.v1')); } catch (e) { }
  let n = 0;
  if (old && Array.isArray(old.cards)) {
    old.cards.filter(c => c.lang === 'ja').forEach(c => {
      const f = c.f || {}, now = Date.now();
      if (c.type === 'mistake') S.mistakes.push({ id: uid(), ref: '', wrong: f.wrong || '', correct: f.correct || '', why: f.why || '', category: '其他', lesson: '', from: c.source || '舊版錯題本', note: f.note || '', count: 1, streak: 0, resolved: false, created: c.created || now, updated: now });
      else if (c.type === 'sentence') S.items.push({ id: uid(), type: 'sentence', term: f.sentence || '', reading: '', meaning: f.translation || '', example: f.mine || '', note: f.why || '', tags: c.tags || [], category: '其他', lesson: '', sourceId: '', origin: 'mine', aiAdded: [], created: c.created || now, updated: now });
      else S.items.push({ id: uid(), type: 'vocab', term: f.term || '', reading: f.reading || '', meaning: f.meaning || '', example: f.example || '', note: f.note || '', tags: c.tags || [], category: '單字', lesson: '', sourceId: '', origin: 'mine', aiAdded: [], created: c.created || now, updated: now });
      n++;
    });
  }
  save();
  return n;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
const hasKana = s => /[぀-ヿ]/.test(s || '');
const hasKanji = s => /[一-鿿々]/.test(s || '');
const hasJa = s => hasKana(s) || hasKanji(s);
function norm(s) { return String(s || '').normalize('NFKC').replace(/[\s　。、，,．.！!？?「」『』（）()〜~～・…:：;；"'“”‘’]/g, '').replace(/私/g, 'わたし').toLowerCase(); }
function kana(s) { return norm(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function bigrams(s) { s = norm(s); const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); if (s.length === 1) g.add(s); return g; }
function sim(a, b) { const A = bigrams(a), B = bigrams(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => { if (B.has(x)) n++; }); return n / (A.size + B.size - n); }
function rb(term, reading) {
  if (reading && /[／\-]/.test(reading)) return esc(term) + ` <span class="muted">${esc(reading)}</span>`;
  if (reading && hasKanji(term)) return `<ruby>${esc(term)}<rt>${esc(reading)}</rt></ruby>`;
  return esc(term) + (reading && kana(reading) !== kana(term) ? `<span class="muted">（${esc(reading)}）</span>` : '');
}
function speak(text) {
  if (!('speechSynthesis' in window)) return toast('此瀏覽器不支援朗讀');
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = .9; speechSynthesis.speak(u);
}
const spk = t => t ? `<button class="spk" data-say="${esc(t)}" onclick="speak(this.dataset.say)" aria-label="朗讀">🔊</button>` : '';
const srcById = id => S.sources.find(s => s.id === id);
function lessonsList() {
  const set = new Set();
  S.sources.forEach(s => s.lesson && set.add(s.lesson));
  S.items.forEach(s => s.lesson && set.add(s.lesson));
  S.questions.forEach(s => s.lesson && set.add(s.lesson));
  return [...set].sort(lessonCmp);
}
function lessonCmp(a, b) {
  const num = l => { const m = String(l).match(/\d+/); return m ? +m[0] : 999; };
  const rank = l => /堂/.test(l) ? 0 : /文法/.test(l) ? 1 : /漢字/.test(l) ? 2 : /會話/.test(l) ? 3 : 4;
  return rank(a) - rank(b) || num(a) - num(b) || a.localeCompare(b);
}
function lessonGroup(l) {

}
const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label == null ? v : label)}</option>`;
const catOpts = cur => CATS.map(c => opt(c, cur)).join('');

/* ===================== 教材（首頁） ===================== */
function lessonStats(l) {
  const it = S.items.filter(x => x.lesson === l), q = S.questions.filter(x => x.lesson === l), src = S.sources.filter(x => x.lesson === l);
  const refs = new Set([...q.map(x => 'q:' + x.id), ...it.filter(x => x.type === 'vocab').flatMap(x => ['vr:' + x.id, 'vm:' + x.id])]);
  const at = S.attempts.filter(a => refs.has(a.ref));
  const done = new Set(at.map(a => a.ref.startsWith('q:') ? a.ref : null).filter(Boolean)).size;
  const acc = at.length ? Math.round(at.filter(a => a.correct).length / at.length * 100) : null;
  const open = S.mistakes.filter(m => !m.resolved && m.lesson === l).length;
  return { it, q, src, at, done, acc, open, vocab: it.filter(x => x.type === 'vocab').length, kanji: it.filter(x => x.type === 'kanji').length, gram: it.filter(x => x.type === 'grammar' || x.type === 'sentence').length };
}

function groupsOf(lessons) {

  const order = [TEACHER_GROUP, 'Learning Japanese like Japanese'];
  return [...m.entries()].sort((a, b) => { const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]); return (ia < 0 ? 9 : ia) - (ib < 0 ? 9 : ib); });
}

/* ===================== 練習 ===================== */
function unitsAll() {
  const u = [];
  S.questions.forEach(q => { if (q.answers && q.answers.length) u.push({ t: 'q', id: q.id, kind: q.kind === 'translate' ? 't' : 'q', lesson: q.lesson, cat: q.category }); });
  S.items.filter(x => x.type === 'kanji' && x.reading).forEach(x => u.push({ t: 'kr', id: x.id, kind: 'kr', lesson: x.lesson, cat: x.category }));
  S.items.filter(x => x.type === 'vocab' && x.term).forEach(x => {
    if (x.reading && hasKanji(x.term)) u.push({ t: 'vr', id: x.id, kind: 'vr', lesson: x.lesson, cat: x.category });
    if (x.meaning) u.push({ t: 'vm', id: x.id, kind: 'vm', lesson: x.lesson, cat: x.category });
  });
  S.mistakes.filter(m => !m.ref && m.correct && !m.resolved).forEach(m => u.push({ t: 'm', id: m.id, kind: 'm', lesson: m.lesson, cat: m.category }));
  return u;
}
const refOf = u => u.t + ':' + u.id;
function filteredUnits() {
  const s = ui.setup;
  const openRefs = new Set(S.mistakes.filter(m => !m.resolved).map(m => m.ref || 'm:' + m.id));
  let u = unitsAll().filter(x => (!s.lesson || x.lesson === s.lesson) && (!s.cat || x.cat === s.cat));
  if (s.mode === 'mistakes') u = u.filter(x => openRefs.has(refOf(x)));
  else u = u.filter(x => x.kind === 'm' ? false : s.kinds[x.kind]);
  return u;
}
function vPractice() {
  if (ui.sess) return vSession();
  const s = ui.setup, u = filteredUnits();
  const openN = S.mistakes.filter(m => !m.resolved).length;
  const chk = (k, l) => `<label class="ck"><input type="checkbox" ${s.kinds[k] ? 'checked' : ''} onchange="ui.setup.kinds.${k}=this.checked;render()"> ${l}</label>`;
  return `<div class="box">
  <h2>練習設定</h2>
  <label>課次</label><select onchange="ui.setup.lesson=this.value;render()">${opt('', s.lesson, '全部課次')}${lessonsList().map(l => opt(l, s.lesson)).join('')}</select>
  <label>類別</label><select onchange="ui.setup.cat=this.value;render()">${opt('', s.cat, '全部類別')}${CATS.map(c => opt(c, s.cat)).join('')}</select>
  <label>模式</label><div class="seg">${[['normal', '一般'], ['new', '沒做過的優先'], ['mistakes', '只練錯題']].map(([k, l]) => `<button class="${s.mode === k ? 'on' : ''}" onclick="ui.setup.mode='${k}';render()">${l}</button>`).join('')}</div>
  ${s.mode === 'mistakes' ? '' : `<label>題型</label><div class="cks">${chk('q', '填空／選擇')}${chk('t', '翻譯')}${chk('vr', '單字：看漢字寫讀音')}${chk('vm', '單字：看中文寫日文')}${chk('kr', '漢字：寫出讀音（音讀或訓讀）')}</div>`}
  <label>題數</label><div class="seg">${[10, 20, 0].map(n => `<button class="${s.count === n ? 'on' : ''}" onclick="ui.setup.count=${n};render()">${n || '全部'}</button>`).join('')}</div>
  <button class="btn full" style="margin-top:16px" ${u.length ? '' : 'disabled'} onclick="startFromSetup()">開始（符合 ${u.length} 題）</button>
  </div>
  ${openN ? `<button class="btn bad full" onclick="ui.setup.mode='mistakes';ui.setup.lesson='';ui.setup.cat='';startFromSetup()">🔥 錯題重練（${openN} 題）</button>` : ''}
  <p class="muted">作答送出後才會顯示答案與解說。答錯會自動收進錯題本，同一題連續答對 2 次就算「已克服」。</p>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function startFromSetup() {
  let u = shuffle(filteredUnits());
  if (ui.setup.mode === 'new') { const done = new Set(S.attempts.map(a => a.ref)); u.sort((a, b) => done.has(refOf(a)) - done.has(refOf(b))); }
  if (ui.setup.count) u = u.slice(0, ui.setup.count);
  startPractice(u);
}
function startPractice(units) {

  ui.sess = { units, i: 0, phase: 'answer', input: {}, res: null, right: 0, wrong: 0, newMist: 0 };
  ui.tab = 'practice'; ui.view = null; render(); scrollTo(0, 0);
}

}

function submitAnswer() {

/* ===================== AI ===================== */
async function callClaude(content, maxTokens) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': S.settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: S.settings.model || 'claude-sonnet-5-5', max_tokens: maxTokens || 8000, messages: [{ role: 'user', content }] })
  });
  let j; try { j = await r.json(); } catch (e) { throw new Error('回應格式錯誤 ' + r.status); }
  if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
  return j.content.map(b => b.text || '').join('');
}
function parseJSON(t) {
  t = String(t).replace(/```(?:json)?/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('回覆中找不到 JSON');
  return JSON.parse(t.slice(a, b + 1));
}
function extractPrompt(title, lesson, text) {
  return `You are helping a Traditional Chinese (Taiwan) speaker organise their Japanese study material into a study app.
Material: "${title || '未命名'}"${lesson ? `, lesson "${lesson}"` : ''}.
${text ? `Material text (extracted from a PDF or copied from a web page; furigana may be mixed into the text):\n"""\n${text}\n"""` : 'The material is in the attached image(s)/file.'}

Extract ONLY what is actually in the material. Do not invent new vocabulary or exercises.
Reply with ONLY a JSON object (no markdown):
{"items":[{"type":"vocab|grammar|sentence","term":"","reading":"","meaning":"","example":"","note":"","category":"","tags":[],"aiAdded":[]}],
 "questions":[{"kind":"fill|choice|translate","context":"","zh":"","prompt":"","options":[],"answers":[],"explain":"","category":"","answerFrom":"material|ai"}],
 "complete":true,"warnings":[]}
Rules:
- vocab: term as written in the material (dictionary form); reading in hiragana/katakana only (empty if the term is all kana); meaning in Traditional Chinese.
- grammar: term = the pattern (e.g. 「〜から〜まで」); meaning = explanation; example = example sentences from the material.
- If you add content that is not in the material (e.g. a Chinese meaning or reading the material does not give), list those field names in "aiAdded".
- fill: write each blank in "prompt" as （　）; "answers" has one string per blank, alternatives separated by "/".
- choice: "prompt" has one （　） blank; "options" lists the choices; "answers" = [the correct option text].
- translate: "zh" = the Chinese sentence; "prompt" = "翻成日文"; "answers" = acceptable Japanese answers. For reading-comprehension questions put the passage in "context".
- If the material includes an answer key, use it and set answerFrom "material". If not, give your answer and set answerFrom "ai". If an answer key looks wrong, keep the key's answer and say so in "explain".
- Remove furigana that is mixed into sentences and rebuild clean text.
- Include legible handwritten notes in "note", prefixed with "手寫：".
- category must be one of: ${CATS.join(', ')}.
- If anything is cut off, unreadable, or seems incomplete, set "complete": false and explain in "warnings" (Traditional Chinese).`;
}

let pdfjsP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsP || (pdfjsP = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';

    sc.onerror = () => { pdfjsP = null; rej(new Error('無法載入 PDF 讀取工具（需要網路連線）')); };
    document.head.appendChild(sc);

async function impReadFiles(files) {
  impSrcRead();
  imp.pages = []; imp.images = []; imp.text = ''; imp.imgDone = new Set(); imp.fileName = [...files].map(f => f.name).join('、');
  if (!imp.src.title && files[0]) imp.src.title = files[0].name.replace(/\.[^.]+$/, '');
  imp.src.file = imp.fileName;
  const texts = [];
  for (const f of files) {
    try {
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
        imp.progress = '讀取 PDF…'; render();
        const lib = await loadPdfJs();
        const doc = await lib.getDocument({ data: await f.arrayBuffer(), cMapUrl: PDFJS + 'cmaps/', cMapPacked: true }).promise;
        for (let p = 1; p <= doc.numPages; p++) {
          imp.progress = `讀取第 ${p}/${doc.numPages} 頁…`; render();
          const pg = await doc.getPage(p), tc = await pg.getTextContent();
          let lines = [], cur = '', lastY = null;
          for (const it of tc.items) {
            const y = it.transform ? it.transform[5] : null;
            if (lastY !== null && y !== null && Math.abs(y - lastY) > 3) { lines.push(cur); cur = ''; }
            cur += it.str; lastY = y;
            if (it.hasEOL) { lines.push(cur); cur = ''; lastY = null; }
          }
          lines.push(cur);
          const text = lines.map(x => x.trim()).filter(Boolean).join('\n');
          const hasText = text.replace(/\s/g, '').length >= 15;
          const page = { n: imp.pages.length + 1, text, hasText, pg };
          if (!hasText) page.thumb = await renderPage(pg, 160, .6);
          imp.pages.push(page);
          if (hasText) texts.push(text);
        }
      } else if (f.type.startsWith('image/')) {
        const url = await fileToDataURL(f);
        imp.images.push({ name: f.name, full: await resizeImg(url, 1600, .85), thumb: await resizeImg(url, 160, .6) });
      } else toast('不支援的檔案：' + f.name);
    } catch (e) { toast('讀取失敗：' + e.message); }
  }

  imp.progress = ''; render();
}
async function renderPage(pg, maxW, q) {
  const v0 = pg.getViewport({ scale: 1 }), sc = Math.min(3, maxW / v0.width), vp = pg.getViewport({ scale: sc });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await pg.render({ canvasContext: ctx, viewport: vp }).promise;
  return c.toDataURL('image/jpeg', q);
}
function fileToDataURL(f) { return new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(f); }); }
function resizeImg(url, maxW, q) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const sc = Math.min(1, maxW / im.width); const c = document.createElement('canvas'); c.width = im.width * sc; c.height = im.height * sc; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = url; });
}

function localParse(text) {

    const kind = s.mode === 'existing' ? src.kind : s.kind;
    const base = { id: uid(), lesson, sourceId: src.id, origin: kind === 'self' ? 'mine' : kind === 'ai' ? 'ai' : 'teacher', created: now, updated: now };
    if (r.kind === 'item') S.items.push(Object.assign({ example: '', note: '', tags: [], aiAdded: [] }, d, base));
    else S.questions.push(Object.assign({}, d, base));
    n++;
  });
  save();
  const l = src.lesson; impReset(); toast(`已存入 ${n} 筆`);
  ui.tab = 'home'; ui.lesson = l || null; render(); scrollTo(0, 0);
}

/* ===================== 設定、備份、功能狀態 ===================== */
function vSettings() {
  const st = S.settings, bk = daysSince(st.lastBackup);
  return `<button class="btn sm ghost" onclick="ui.view=null;render()">← 返回</button>
  <div class="box"><h2>✨ AI 設定</h2>
  <div class="muted small">沒有金鑰也能用：需要 AI 的地方會複製提示詞，貼到 ChatGPT 後再把回覆貼回來。填入 Claude API 金鑰後可一鍵整理，並能直接辨識圖片教材。金鑰只存在這個瀏覽器。</div>
  <label>Claude API 金鑰</label><input type="password" id="s_key" value="${esc(st.apiKey)}" placeholder="sk-ant-…" autocomplete="off">
  <label>模型</label><input type="text" id="s_model" value="${esc(st.model)}">
  <button class="btn sm" style="margin-top:10px" onclick="S.settings.apiKey=$('s_key').value.trim();S.settings.model=$('s_model').value.trim()||'claude-sonnet-5-5';save();toast('已儲存')">儲存</button></div>
  <div class="box"><h2>💾 備份與還原</h2>
  <div class="muted small">所有資料只存在這個瀏覽器。清除瀏覽器資料、換手機都會遺失，請定期匯出。${bk === null ? '<b>尚未備份過。</b>' : `上次備份：${bk} 天前。`}</div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="exportData()">⬇️ 匯出備份</button><label class="btn ghost filebtn">⬆️ 還原備份<input type="file" accept=".json,application/json" onchange="importBackup(this)"></label></div>
  <div class="muted small" style="margin-top:6px">還原時會合併：已存在的資料保留，備份中新的資料加入。</div></div>
  <div class="box"><h2>📚 預載教材</h2><div class="muted small">如果誤刪了預載的第1–6堂內容，可以重新補回（已存在的不會重複）。</div>
  <button class="btn sm ghost" style="margin-top:8px" onclick="const n=applySeed(true);toast(n?'補回 '+n+' 筆':'沒有缺少的內容');render()">補回預載教材</button></div>
  <div class="box"><h2>📊 資料統計</h2><div class="muted">來源 ${S.sources.length}・單字／文法 ${S.items.length}・題目 ${S.questions.length}・作答紀錄 ${S.attempts.length}・錯題 ${S.mistakes.length}・家教問題 ${S.tutor.length}</div></div>
  <button class="btn ghost full" onclick="openView('status')">🧭 功能開發狀態</button>
  <button class="btn bad full" style="margin-top:12px" onclick="wipe()">清除全部資料</button>`;
}
function vStatus() {
  const L = (t, a) => `<div class="box"><h2>${t}</h2>${a.map(x => `<div class="stline">${x}</div>`).join('')}</div>`;
  return `<button class="btn sm ghost" onclick="ui.view='settings';render()">← 返回</button>
  ${L('✅ 已實作', ['三種匯入：貼上文字、PDF／圖片、網址來源', 'PDF 自動判斷文字頁與圖片頁，並提示「內容不完整」', '匯入預覽：欄位驗證、錯誤提示、可直接修改', '自動去重：完全相同自動略過；相似內容讓你選略過／合併／另存', '自動分類：AI 判斷，或依助詞與疑問詞規則判斷；可手動修改', '分批補入既有來源', '每筆資料連回課次與來源，標示「教材／我的筆記／AI 補充」', '可填答的練習：填空（輸入框在句子裡）、選擇、翻譯、單字讀音、中翻日', '送出後才顯示答案與解說', '答錯自動收進錯題本，連對 2 次算已克服', '弱點分析：依類別統計錯題與正確率', '家教討論清單：從題目、錯題、單字一鍵加入，可複製清單、記錄老師回答', '備份匯出與還原（合併）', '日文朗讀', '預載第1–6堂可讀取的教材內容，以及 Learning Japanese like Japanese 的文法 10 章、N5／N4 漢字、問候語、自我介紹、餐廳會話', '教材清單：依資料夾分組，可依狀態篩選、搜尋；匯入同名檔案時會提醒', '漢字讀音練習（音讀、訓讀任一皆可）'])}
  ${L('⚠️ 部分實作', ['網址匯入：只記錄網址；瀏覽器限制無法自動讀取其他網站，內容需貼上或存成 PDF', '翻譯題批改：與參考答案完全相同才自動判對，其他情況由你自評或用 AI 批改（需金鑰）', '圖片教材辨識：需 Claude API 金鑰；沒有金鑰時要手動上傳到 ChatGPT', '預載教材：第1–2堂主講義、第3堂量詞表與年齡表是圖片，尚未匯入', '「吃東西買東西」原始 PDF 左側被裁切，句子由 AI 補回，需要對照網站確認'])}
  ${L('⏳ 待開發', ['間隔複習排程（依記憶曲線安排複習日期）', '每週測驗、模擬題與成績紀錄', 'JLPT 級數標記與篩選', '動詞變化專項自動出題', '多裝置同步（目前只存在單一瀏覽器）'])}`;
}
function exportData() {
  S.settings.lastBackup = Date.now(); save();
  const data = JSON.parse(JSON.stringify(S)); data.settings.apiKey = '';
  const b = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '日本語ノート備份-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1000);
  toast('已匯出（不含 API 金鑰）'); render();
}
function importBackup(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || d.v !== 2) throw new Error('不是日本語ノート的備份檔');
      let n = 0;
      ['sources', 'items', 'questions', 'mistakes', 'tutor'].forEach(k => { const ids = new Set(S[k].map(x => x.id)); (d[k] || []).forEach(x => { if (x && x.id && !ids.has(x.id)) { S[k].push(x); n++; } }); });
      const ak = new Set(S.attempts.map(a => a.ref + a.at)); (d.attempts || []).forEach(a => { if (!ak.has(a.ref + a.at)) S.attempts.push(a); });
      save(); render(); toast(`已還原 ${n} 筆新資料`);
    } catch (e) { toast('還原失敗：' + e.message); }
  };
  r.readAsText(f);
}
function wipe() {
  if (!confirm('確定清除全部資料？建議先匯出備份。')) return;
  if (prompt('請輸入「清除」確認') !== '清除') return;
  const key = S.settings.apiKey; S = blank(); S.settings.apiKey = key; S.settings.migratedV1 = true; S.seedVersion = SEED_VERSION; save(); ui.view = null; go('home');
}

/* ---------- boot ---------- */
(function boot() {
  const fresh = !localStorage.getItem(KEY);
  const n = applySeed(false), m = migrateV1();
  render();
  if (fresh && n) setTimeout(() => toast(`已載入第1–6堂教材（${n} 筆）`), 300);
  if (m) setTimeout(() => toast(`已從舊版錯題本轉入 ${m} 筆日文資料`), 3000);
})();

</script>
</body>
</html>
